<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataEmergencia · ejemplo vanilla (IIFE)</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #10151d;
        color: #f5f7fa;
      }
      .demo {
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }
      .sos {
        width: 148px;
        height: 148px;
        margin: 24px auto;
        font:
          800 34px/1 system-ui,
          sans-serif;
        color: #fff;
        cursor: pointer;
        background: #e11d2e;
        border: 8px solid #ff6b78;
        border-radius: 50%;
        box-shadow: 0 18px 50px rgb(225 29 46 / 45%);
      }
      .sos:focus-visible {
        outline: 4px solid #fff;
        outline-offset: 6px;
      }
      code {
        color: #9fb3c8;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <h1>DataEmergencia</h1>
      <p>
        Ejemplo sin React en el host: el bundle IIFE monta el panel y usa el BFF
        simulado en <code>http://localhost:8787/de-bff/emergency</code>.
      </p>
      <button class="sos" id="sos" type="button">SOS</button>
      <p>
        Ejecuta <code>pnpm run example:vanilla</code> (mock BFF + copia del
        bundle) o inicia ambos procesos por separado. Para revisar todos los
        estados visuales abre <a href="./lab.html">lab.html</a>.
      </p>
      <div id="emergency-root"></div>
    </main>

    <script src="./emergency.global.js"></script>
    <script>
      const client = window.DataEmergenciaEmergency.mount({
        root: '#emergency-root',
        bffBaseUrl: 'http://localhost:8787/de-bff/emergency',
        code: 'DABC12',
        trigger: '#sos',
        fallback: { phone: '+57 300 123 4567', label: 'Línea de emergencia' },
        onEvent(event, payload) {
          console.info('[emergency]', event, payload);
        },
      });

      window.addEventListener('pagehide', () => client.destroy(), {
        once: true,
      });
    </script>
  </body>
</html>
